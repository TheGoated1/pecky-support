name: Pecky support request
description: Report a problem using Pecky. Do not include passwords, invitation codes or private recipe links.
title: "Support: "
labels: [support]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Pecky. Please keep personal or sensitive information out of this public request.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Opened…\n2. Tapped…\n3. Saw…"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15, iOS 26.1
  - type: input
    id: app-version
    attributes:
      label: Pecky version
      placeholder: 1.0.0
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included a password, household invitation code or private recipe link.
          required: true
